[project]
name = "backend"
version = "0.1.0"
description = "BookKeeper のバックエンド（FastAPI）"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import順, B: bugbear,
# UP: pyupgrade, SIM: 簡略化, ANN: 型ヒント必須
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
# テストでは型注釈チェックを緩める
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
